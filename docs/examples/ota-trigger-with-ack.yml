# Copy to .github/workflows/ota-trigger.yml in YOUR repository (not in the action repository).
# Builds firmware, uploads it as a release asset elsewhere, then tells a device group to update
# and waits until a gateway/device confirms on the ack topic.
name: OTA trigger with acknowledgement

on:
  workflow_dispatch:
    inputs:
      group:
        description: Device group
        required: true
        default: staging

jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OTA and wait for ack
        id: ota
        uses: connectmq/connectmq-mqtt-publish@v1
        with:
          username: ${{ secrets.MQTT_USERNAME }}
          password: ${{ secrets.MQTT_PASSWORD }}
          client-id: ${{ secrets.MQTT_CLIENT_ID }}
          topic: fleet/${{ inputs.group }}/ota/request
          message: '{"firmware":"https://example.com/fw/${{ github.sha }}.bin","sha":"${{ github.sha }}"}'
          qos: 1
          wait-topic: fleet/${{ inputs.group }}/ota/ack
          wait-timeout-seconds: 120

      - name: Show ack
        run: echo "Device replied: $REPLY"
        env:
          REPLY: ${{ steps.ota.outputs.reply }}
